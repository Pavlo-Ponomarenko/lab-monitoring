apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-exporter
  namespace: monitoring
  labels:
    app: web-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-exporter
  template:
    metadata:
      labels:
        app: web-exporter
    spec:
      containers:
        - name: web-exporter
          image: nginx/nginx-prometheus-exporter:latest
          args:
            - "-nginx.scrape-uri=http://web:80/stub_status"
          ports:
            - containerPort: 9113
---
apiVersion: v1
kind: Service
metadata:
  name: web-exporter
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: web-exporter
  ports:
    - port: 9113
      targetPort: 9113